name: Cargo checks pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-check:
    name: Cargo check (release, all targets)
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check release targets
        run: cargo check --release --all-targets
