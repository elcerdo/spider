[package]
name = "spider"
edition = "2024"
rust-version = "1.97.1"
version = "0.1.0"
authors = ["pierre.gueth@gmail.com"]

[features]
debug_scene = []
debug_gizmos = []  

[dependencies]
env_logger = "0.11.11"
bytemuck = "1.25.2"
wgpu = "30.0.1"
log = { version = "0.4.35", features = ["std"] }
clap = { version = "4.6.7", features = ["derive"] }
bevy = { version = "0.20.1", features = ["webgpu", "web"] }
priority-queue = "2.7.0"
kd-tree = { version = "0.6.2", features = ["nalgebra"] }
typenum = "1.20.1"
regex = "1.13.1"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster = { version = "1.0.1", features = ["macro"] }

